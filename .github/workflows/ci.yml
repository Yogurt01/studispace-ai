name: Quality Gate

# Runs on every pull request and every push. Deterministic and hermetic:
# no Gemini quota, no Firebase service account, no local Ollama, no GPU.
on:
  # Pushes to main run the gate through deploy.yml instead, so it is not run twice.
  push:
    branches-ignore: [main]
  pull_request:
  # Callable as a reusable workflow so deploy.yml gates on the same checks
  # instead of duplicating them.
  workflow_call:

# github.workflow resolves to the *calling* workflow, so a reusable invocation
# from Deploy gets its own group and cannot be cancelled by a standalone run.
concurrency:
  group: ${{ github.workflow }}-quality-gate-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      # Browser-safe placeholder Firebase config so the client SDK can initialize
      # during hermetic E2E. These are not secrets and grant no access.
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:ciplaceholder"
      # CI has no Ollama and must not depend on Gemini quota.
      AI_PROVIDERS: gemini
      # Hermetic E2E stubs every model call, so no real developer password is
      # needed — only a configured one, so the unlock endpoint is reachable.
      DEVELOPER_MODE_PASSWORD: ci-placeholder-developer-password
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit and mocked provider tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (hermetic)
        run: npm run test:e2e

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — no registry credentials needed for a pull request.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: studispace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # No NODE_ENV here on purpose: the image must serve the production
          # build on its own. Passing NODE_ENV=production would hide exactly the
          # misconfiguration that put a Vite dev server into production.
          docker run -d --name studispace-ci -p 8080:8080 \
            -e GEMINI_API_KEY=ci-placeholder \
            -e AI_PROVIDERS=gemini \
            -e DEVELOPER_MODE_PASSWORD=ci-placeholder-developer-password \
            -e VITE_FIREBASE_API_KEY=ci-placeholder-api-key \
            -e VITE_FIREBASE_PROJECT_ID=ci-placeholder \
            studispace:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health > /dev/null && break
            if [ "$i" = 30 ]; then
              echo "::error::health check never passed"
              docker logs studispace-ci
              docker rm -f studispace-ci
              exit 1
            fi
            sleep 2
          done
          echo "health check passed"

          fail() { echo "::error::$1"; docker logs studispace-ci; docker rm -f studispace-ci; exit 1; }

          # Regression test for the production outage: the container must serve
          # the built app under the real public hostname. A Vite dev server
          # answers this with 403 "Blocked request. This host is not allowed."
          HOME_PAGE=$(curl -fsS -H "Host: studispace.ai.studio" http://localhost:8080/) \
            || fail "the container refused the production Host header"
          case "$HOME_PAGE" in
            *"Blocked request"*) fail "a Vite dev server is serving this image" ;;
            *"<div id=\"root\">"*) echo "production build served under the production hostname" ;;
            *) fail "unexpected home page; not the built index.html" ;;
          esac

          # The built client must be present and static, not transformed on the fly.
          ASSET=$(printf '%s' "$HOME_PAGE" | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$ASSET" ] || fail "index.html references no hashed client bundle"
          curl -fsS -o /dev/null -H "Host: studispace.ai.studio" "http://localhost:8080$ASSET" \
            || fail "hashed client bundle $ASSET is not served"

          # Browser-safe config only, and the model catalogue must be reachable.
          CONFIG=$(curl -fsS http://localhost:8080/runtime-config.js) || fail "runtime-config.js unreachable"
          case "$CONFIG" in
            *GEMINI_API_KEY*|*DEVELOPER_MODE_PASSWORD*|*private_key*|*ci-placeholder-developer-password*)
              fail "runtime-config.js leaked a server secret" ;;
          esac

          MODELS=$(curl -fsS http://localhost:8080/api/ai/models) || fail "/api/ai/models unreachable"
          echo "$MODELS" | grep -q '"id":"gemini-2.5-flash"' || fail "free model missing from the catalogue"
          echo "$MODELS" | grep -q '"tier":"developer"' || fail "developer tier missing from the catalogue"

          # A developer model must be refused without a developer token.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/socrates/chat \
            -H 'Content-Type: application/json' \
            -d '{"threadId":"ci","message":"hi","mode":"socratic","model":"qwen3-local"}')
          [ "$STATUS" = "403" ] || fail "developer model was not refused without a token (HTTP $STATUS)"

          docker rm -f studispace-ci
